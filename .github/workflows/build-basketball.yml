name: Build College Basketball League

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-basketball.yml'
      - 'build_basketball.py'
      - 'basketball_D1_source.json'
      - 'college_basketball_all_1306_teams_REAL_LOGOS.json'

permissions:
  contents: write

concurrency:
  group: build-basketball
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate basketball imports
        run: python build_basketball.py
      - name: Commit basketball JSON
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add basketball_2026.json basketball_2026_D1.json basketball_D1_football_format.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated basketball imports'
            git push
          fi
