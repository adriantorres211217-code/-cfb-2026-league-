name: Build nationwide high school league

on:
  push:
    paths:
      - ".github/workflows/build-high-school.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build nationwide high school JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import re
          import urllib.request

          SOURCE = "https://raw.githubusercontent.com/CyberSkyline/schools/main/dist/us_high_schools.json"
          OUTPUT = "high_school_football_all_usa.json"

          REGION = {
              "AL":"Southeast","AK":"West","AZ":"Southwest","AR":"South","CA":"West","CO":"West",
              "CT":"Northeast","DE":"Northeast","FL":"Southeast","GA":"Southeast","HI":"West",
              "ID":"West","IL":"Midwest","IN":"Midwest","IA":"Midwest","KS":"Midwest","KY":"South",
              "LA":"South","ME":"Northeast","MD":"Northeast","MA":"Northeast","MI":"Midwest",
              "MN":"Midwest","MS":"South","MO":"Midwest","MT":"West","NE":"Midwest","NV":"West",
              "NH":"Northeast","NJ":"Northeast","NM":"Southwest","NY":"Northeast","NC":"Southeast",
              "ND":"Midwest","OH":"Midwest","OK":"South","OR":"West","PA":"Northeast","RI":"Northeast",
              "SC":"Southeast","SD":"Midwest","TN":"South","TX":"South","UT":"West","VT":"Northeast",
              "VA":"Southeast","WA":"West","WV":"South","WI":"Midwest","WY":"West","DC":"Northeast"
          }

          STATE_ORDER = [
              "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS",
              "KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY",
              "NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV",
              "WI","WY","DC"
          ]

          def hash32(text):
              h = 2166136261
              for ch in text:
                  h ^= ord(ch)
                  h = (h * 16777619) & 0xFFFFFFFF
              return h

          def color(seed, shift):
              return f"#{(hash32(seed + '|' + str(shift)) & 0xFFFFFF):06X}"

          def abbr(name, state):
              words = re.findall(r"[A-Z0-9]+", name.upper())
              if len(words) > 1:
                  core = "".join(w[0] for w in words[:5])
              else:
                  core = (words[0] if words else state)[:5]
              return (core + state)[:6]

          def prestige(school):
              try:
                  pop = float(school.get("population") or 0)
              except (TypeError, ValueError):
                  pop = 0

              value = 44 + min(18, math.log10(max(10, pop)) * 6)
              if school.get("type") == "PRIVATE":
                  value += 1
              return max(40, min(70, round(value, 1)))

          print("Downloading nationwide high-school master list...")
          req = urllib.request.Request(
              SOURCE,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=180) as response:
              schools = json.load(response)

          print(f"Downloaded {len(schools):,} schools")

          by_state = {st: [] for st in STATE_ORDER}

          for school in schools:
              st = str(school.get("state") or "").strip().upper()
              if st not in by_state:
                  continue

              name = str(school.get("name") or "Unknown High School").strip()

              by_state[st].append({
                  "name": f"{name} ({st})",
                  "mascot": "Football",
                  "primary": color(name + "|" + st, 1),
                  "secondary": color(name + "|" + st, 2),
                  "tertiary": "#FFFFFF",
                  "prestige": prestige(school),
                  "offenseScheme": "spread",
                  "defenseScheme": "4-2-5",
                  "abbreviation": abbr(name, st),
                  "region": REGION.get(st, "National"),
                  "logoURL": ""
              })

          conferences = []

          for st in STATE_ORDER:
              teams = sorted(by_state[st], key=lambda x: x["name"])
              conferences.append({
                  "name": f"{st} High School",
                  "requiredConferenceGames": 0,
                  "conferencePrestige": 50.0,
                  "tier": "High School",
                  "teams": teams,
                  "protectedPairs": []
              })

          league = {
              "conferences": conferences,
              "independents": [],
              "bowls": [],
              "ny6Bowls": [],
              "rivalries": [],
              "protectedPairs": [],
              "nationalChampionshipLogoURL": "",
              "subdivisionTeams": [],
              "awardCustomizations": []
          }

          total = sum(len(c["teams"]) for c in conferences)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  league,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print(f"Built {total:,} high schools")
          PY

      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          path = "high_school_football_all_usa.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          conferences = data.get("conferences", [])
          teams = sum(len(c.get("teams", [])) for c in conferences)

          print("Conferences:", len(conferences))
          print("Teams:", teams)
          print("File bytes:", os.path.getsize(path))

          assert len(conferences) == 51
          assert teams > 10000
          PY

      - name: Commit generated file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add high_school_football_all_usa.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build nationwide high school football league"
            git push
          fi
